<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaziWeb Reader</title>
<style>
:root{--bg:#faf8f5;--pn:#fff;--tx:#2a2622;--mu:#7a7168;--bd:#e6e0d8;--ac:#c0392b;--hl:#fde68a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12100e;--pn:#1c1916;--tx:#e8e2da;--mu:#9a9188;--bd:#2e2a25;--hl:#6b5a14}}
:root[data-theme=dark]{--bg:#12100e;--pn:#1c1916;--tx:#e8e2da;--mu:#9a9188;--bd:#2e2a25;--hl:#6b5a14}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--pn);border-bottom:1px solid var(--bd)}
header h1{font-size:17px;margin:0;flex:1;color:var(--ac)}
button,select,input,textarea{font:inherit;color:var(--tx)}
.b{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;cursor:pointer}
.b:hover{border-color:var(--ac)}.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{flex:1;display:flex;min-height:0}
aside{width:320px;overflow-y:auto;padding:12px;border-right:1px solid var(--bd);display:flex;flex-direction:column;gap:12px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);margin:0 0 8px}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
select,input[type=text],textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
textarea{resize:vertical;min-height:60px}input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.personas{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pe{text-align:left;font-size:12px;line-height:1.3}.pe.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
.pe small{display:block;color:var(--mu)}
.ctl{display:flex;justify-content:center;gap:8px;margin-top:10px}.ctl .b{min-width:42px}
section{flex:1;overflow-y:auto;scroll-behavior:smooth}
#bar{position:sticky;top:0;height:3px;background:var(--bd);z-index:2}#bar i{display:block;height:100%;width:0;background:var(--ac)}
#top{position:sticky;top:3px;z-index:2;display:flex;gap:8px;align-items:center;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--bd);font-size:12px;color:var(--mu)}
#top select{max-width:220px;flex:0 1 220px}#top span{flex:1;text-align:right}
article{max-width:720px;margin:0 auto;padding:28px 22px 120px;font-family:Georgia,"Times New Roman",serif;line-height:1.85}
article p{margin:0 0 1.2em}.s{cursor:pointer;border-radius:3px}.s:hover{background:color-mix(in srgb,var(--hl) 40%,transparent)}
.s.on{background:var(--hl)}.s.dl{font-style:italic}.ch{font-weight:700;font-size:1.3em;margin:1.6em 0 .8em;color:var(--ac)}
#welcome{text-align:center;color:var(--mu);margin-top:12vh;padding:0 20px}
.note{font-size:11px;color:var(--mu);margin-top:6px;line-height:1.4}
body{height:100vh;height:100dvh;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#guide,#panel{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}#guide[hidden],#panel[hidden]{display:none}
.gbox{background:var(--pn);border:1px solid var(--bd);border-radius:14px;max-width:560px;width:100%;max-height:85vh;max-height:85dvh;overflow:auto;padding:16px;position:relative}
.gbox h2{margin:0 0 10px;font-size:16px;color:var(--ac)}#gbody{white-space:pre-line;line-height:1.7}#gclose{position:absolute;top:8px;right:8px}
.fl{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;font-size:18px;line-height:1}
#langMenu{position:absolute;right:0;top:calc(100% + 4px);z-index:60;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:4px;min-width:140px}#langMenu[hidden]{display:none}#langMenu .b{text-align:left;border:0;white-space:nowrap}
:root[data-theme=sepia]{--bg:#f4ecd8;--pn:#fbf5e6;--tx:#3b3228;--mu:#7d6e58;--bd:#e0d3b4;--hl:#f2cf6b}
:root{--ff:Georgia,"Times New Roman",serif;--lh:1.85;--ta:left}
article{font-family:var(--ff);line-height:var(--lh);text-align:var(--ta)}
::highlight(wd){background:var(--ac);color:#fff}
#seltb{position:fixed;z-index:40;display:flex;gap:4px;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.25)}#seltb[hidden]{display:none}
#seltb .b{padding:4px 9px;font-size:16px}.res{padding:8px;border-bottom:1px solid var(--bd);cursor:pointer;line-height:1.5}.res:hover{background:var(--bg)}
#pbody h3{margin:12px 0 4px;font-size:13px;color:var(--mu)}header{flex-wrap:wrap}
@media(max-width:760px){header .sb,header .nb{display:none}header .b{padding:6px 8px}}
ruby rt{font-size:.5em;color:var(--mu)}#top{flex-wrap:wrap}
figure.fg{margin:0 0 1.2em;text-align:center}figure.fg img{max-width:100%;cursor:zoom-in;border-radius:4px}
.tbl{overflow-x:auto;margin:0 0 1.2em;cursor:zoom-in;font-size:.85em;line-height:1.5}.tbl table{border-collapse:collapse}.tbl td,.tbl th{border:1px solid var(--bd);padding:4px 8px}
#fs{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);overflow:auto;padding:16px;display:flex;align-items:flex-start;justify-content:center}#fs[hidden]{display:none}
#fs img{max-width:100%;height:auto}#fs .tbl{background:var(--pn);padding:12px;border-radius:8px;font-size:1em}
@media(min-width:900px){article.cols{column-count:2;column-gap:56px;max-width:1100px}}
@media print{@page{size:A5;margin:12mm}header,aside,#top,#mbar,#bar,#seltb,#panel,#guide{display:none!important}body,main,section{display:block!important;height:auto!important;overflow:visible!important}article{padding:0!important;max-width:none!important;font-size:11pt!important;color:#000}.s.on{background:none}}
#mbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--pn);border-top:1px solid var(--bd)}
#mbar .b{flex:1;font-size:20px;min-height:46px}#closeSet{display:none;width:100%}
@media(max-width:760px){
 main{flex-direction:column}
 aside{position:fixed;left:0;right:0;bottom:0;width:100%;max-height:82vh;max-height:82dvh;z-index:30;background:var(--bg);border:0;border-top:1px solid var(--bd);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .25s;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.3);visibility:hidden}
 aside.open{transform:none;visibility:visible}
 #mbar{display:flex}#closeSet{display:block}
 article{padding:18px 16px 120px}#top select{max-width:150px}
 input,select,textarea{font-size:16px}.b{min-height:40px}header h1{font-size:15px}
}
</style>

</head>
<body>
<header>
  <h1>📖 LaziWeb Reader</h1>
  <button class="b" id="fm" title="Giảm cỡ chữ">A−</button><button class="b" id="fp" title="Tăng cỡ chữ">A+</button>
  <div style="position:relative"><button class="b" id="langBtn" aria-label="Language" title="Language"></button><div id="langMenu" hidden></div></div>
  <button class="b sb">🔍</button><button class="b nb">📒</button>
  <button class="b" id="help">?</button>
  <button class="b" id="theme" title="Sáng/Tối">🌓</button>
</header>
<main>
<aside>
  <button class="b" id="closeSet">✕ Đóng cài đặt</button>
  <div class="card"><h2 data-i="doc"></h2><div class="note" id="plat"></div>
    <input type="file" id="file" accept=".txt,.html,.htm,.md,.pdf,.epub,.mobi,.azw,.azw3,.prc,.fb2,.docx,.cbz,.cbt,.png,.jpg,.jpeg,.webp" style="width:100%">
    <label data-i="url"></label>
    <div class="row"><input type="text" id="url" placeholder="https://..." style="flex:3"><button class="b pri" id="getUrl" style="flex:1" data-i="load"></button></div>
    <div class="note" id="urlSt"></div>
    <label data-i="paste"></label><textarea id="paste" data-ph="pasteph"></textarea>
    <button class="b" id="loadPaste" style="margin-top:6px;width:100%" data-i="readpaste"></button>
  </div>

  <div class="card"><h2 data-i="lib"></h2><div id="libl"></div>
    <label data-i="lsrc"></label><div class="row"><input type="text" id="lsrc" placeholder="https://.../Library.txt"><button class="b" id="lref" style="flex:0 0 46px" title="Refresh">🔄</button></div><div class="note" id="lst"></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx);margin-top:8px"><input type="checkbox" id="qnext" style="width:auto"><span data-i="qnext"></span></label>
    <div class="row" style="margin-top:8px"><input type="text" id="ln" data-ph="libname"><input type="text" id="lu" placeholder="https://..."></div>
    <button class="b" id="la" style="margin-top:6px;width:100%" data-i="libadd"></button></div>

  <div class="card"><h2 data-i="voice"></h2>
    <div class="personas" id="personas"></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="auto" checked style="width:auto"><span data-i="autolang"></span></label>
    <label data-i="sysv"></label><select id="voice"></select>
    <label data-i="dlgv"></label><select id="voice2"></select>
    <label><span data-i="dlgv"></span> · <span data-i="pitch"></span> <b id="dpv">1.20</b></label><input type="range" id="dpitch" min=".8" max="1.6" step=".05" value="1.2">
    <div class="row"><div><label><span data-i="rate"></span> <b id="rv">1.0×</b></label><input type="range" id="rate" min=".6" max="2" step=".05" value="1"></div>
    <div><label><span data-i="pitch"></span> <b id="pv">1.0</b></label><input type="range" id="pitch" min=".5" max="1.5" step=".05" value="1"></div></div>
    <label data-i="sleep"></label>
    <select id="sleep"><option value="0" data-i="none"></option><option value="15">15′</option><option value="30">30′</option><option value="60">60′</option><option value="-1" data-i="chap"></option></select>
    <div class="ctl">
      <button class="b" id="prev" title="Câu trước">⏮</button>
      <button class="b pri" id="play" title="Phát / Tạm dừng (Space)">▶</button>
      <button class="b" id="stop" title="Dừng">⏹</button>
      <button class="b" id="next" title="Câu sau">⏭</button>
    </div>
    
  </div>

  <div class="card"><h2 data-i="tune"></h2>
    <label><span data-i="nvol"></span> <b id="v_nvol"></b></label><input type="range" id="nvol" min="0" max="1" step=".05" value="1">
    <label><span data-i="drate"></span> <b id="v_drate"></b></label><input type="range" id="drate" min=".7" max="1.3" step=".05" value=".95">
    <label><span data-i="dvol"></span> <b id="v_dvol"></b></label><input type="range" id="dvol" min="0" max="1" step=".05" value="1">
    <label><span data-i="gap"></span> <b id="v_gap"></b></label><input type="range" id="gap" min="0" max="1000" step="20" value="140">
    <label><span data-i="pgap"></span> <b id="v_pgap"></b></label><input type="range" id="pgap" min="0" max="2000" step="50" value="250">
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="vprof" checked style="width:auto"><span data-i="vprof"></span></label>
    <div class="row" style="margin-top:8px"><button class="b pri" id="vtest" data-i="vtest"></button><button class="b" id="vreset" data-i="vreset"></button></div></div>

  <div class="card"><h2 data-i="fix"></h2>
    <textarea id="fix" data-ph="fixph"></textarea>
    <label data-i="spellh"></label><textarea id="spell" data-ph="spellph"></textarea>
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="norm" style="width:auto"><span data-i="norm"></span></label>
  </div>

  <div class="card"><h2 data-i="disp"></h2>
    <div class="row"><select id="ff"><option value="serif">Aa Serif</option><option value="sans">Aa Sans</option></select><label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" id="jus" style="width:auto">⇔</label></div>
    <label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="cols" style="width:auto">▥ 2</label>
    <label>↕ <b id="lhv"></b></label><input type="range" id="lh" min="1.4" max="2.4" step=".05" value="1.85"></div>

  <div class="card"><h2><span data-i="amb"></span> 🌿</h2>
    <div class="personas" id="amb"></div>
    <label data-i="vol"></label><input type="range" id="avol" min="0" max="1" step=".01" value=".35">
    
  </div>
</aside>

<section id="sec">
  <div id="bar"><i></i></div>
  <div id="top" hidden><select id="toc"></select><button class="b" id="clean">🧹</button><button class="b" id="pyb" hidden>拼</button><button class="b" id="pgv" hidden>📄</button><button class="b" id="exp">⬇️</button><button class="b" id="prt">🖨️</button><span id="lgi" class="fl" style="flex:0 0 auto;font-size:14px"></span><span id="stat"></span></div>
  <article id="doc" hidden></article>
  <div id="welcome"><div style="font-size:56px">📚</div><h2 style="font-family:Georgia,serif" data-i="wt"></h2><p data-i="wp"></p><button class="b pri" id="openDef" data-i="opendef"></button></div>
</section>
</main>
<div id="panel" hidden><div class="gbox"><button class="b" id="pclose">✕</button><h2 id="ptitle"></h2><div id="pbody"></div></div></div>
<div id="seltb" hidden><button class="b" data-a="read">🔊</button><button class="b" data-a="note">📝</button><button class="b" data-a="tr">🌐</button></div>
<div id="guide" hidden><div class="gbox"><button class="b" id="gclose">✕</button><h2 data-i="gt"></h2><div id="gbody"></div></div></div>
<div id="mbar"><button class="b" id="mprev" aria-label="Câu trước">⏮</button><button class="b pri" id="mplay" aria-label="Phát / Tạm dừng">▶</button><button class="b" id="mnext" aria-label="Câu sau">⏭</button><button class="b sb">🔍</button><button class="b nb">📒</button><button class="b" id="gear" aria-label="Cài đặt">⚙️</button></div>

<script>
(()=>{
const $=id=>document.getElementById(id),synth=window.speechSynthesis;
function cancelAll(){synth.cancel();if(S.audio){S.audio.pause();S.audio=null}}
const S={sents:[],chap:[],idx:0,on:false,paused:false,key:'',pre:'',sleepEnd:0,sleepChap:false};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Theme & font ---------- */
const root=document.documentElement;let fs=store.get('fs',18);
const applyFs=()=>$('doc').style.fontSize=fs+'px';applyFs();
$('fm').onclick=()=>{fs=Math.max(13,fs-1);store.set('fs',fs);applyFs()};
$('fp').onclick=()=>{fs=Math.min(30,fs+1);store.set('fs',fs);applyFs()};
const th=store.get('theme',null);if(th)root.dataset.theme=th;
$('theme').onclick=()=>{const O=['light','sepia','dark'],c=root.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');root.dataset.theme=O[(O.indexOf(c)+1)%3];store.set('theme',root.dataset.theme)};

/* ---------- Text processing ---------- */
const clean=t=>t.replace(/\r/g,'').replace(/^[ \t]*(Final URL|URL Source|Source URL|Published Time|Markdown Content|URL)[ \t]*:.*$/gim,'').replace(/https?:\/\/\S+|www\.\S+/gi,'').replace(/\[\d+\]|\[edit\]/gi,'').replace(/^\s*\d+\s*$/gm,'').replace(/[ \t\u00a0]{2,}/g,' ').replace(/\n[ \t]*\n+/g,'\n\n').trim();
const JUNK_CLS=/(^|[\s_-])(ads?|adv\w*|advert\w*|banner|sponsor\w*|share|sharing|social|related|comments?|sidebar|menu|popup|modal|breadcrumbs?|newsletter|promo\w*|widget|tags?|author-box|pagination|recommend\w*|footer|header|toolbar)([\s_-]|$)/i;
const JUNK_TXT=/^(quảng cáo|đọc thêm|xem thêm|tin liên quan|bình luận|chia sẻ|theo dõi|đăng ký|đăng nhập|tải app|nguồn:|tags?:|từ khóa|bài viết liên quan|advertisement|related|share|read more|subscribe|sign in|cookie)/i;
function fromHTML(h){
  const d=new DOMParser().parseFromString(h,'text/html');
  const title=(d.querySelector('h1')||d.querySelector('title')||{}).textContent;
  // khối chứa bài viết (vd. class "sidebar-1" của VnExpress) không được xoá nhầm
  const isContent=e=>e.querySelector('article,main,[itemprop=articleBody],[class*=fck_detail],[class*=article-body],[class*=content-detail]')||[...e.children].filter(c=>c.tagName==='P'&&c.textContent.length>60).length>=3;
  d.querySelectorAll('script,style,noscript,iframe,svg,form,nav,header,footer,aside,button,select,ins,figure,video,audio,canvas,template,[role=navigation],[role=banner],[aria-hidden=true],[hidden]').forEach(e=>e.remove());
  d.querySelectorAll('body *').forEach(e=>{if(!e.isConnected||e.matches('article,main')||isContent(e))return;if(JUNK_CLS.test((e.className&&e.className.baseVal!==undefined?'':e.className)+' '+e.id))e.remove()});
  d.querySelectorAll('br').forEach(b=>b.replaceWith('\n'));
  const linkLen=e=>[...e.querySelectorAll('a')].reduce((n,a)=>n+a.textContent.length,0);
  let best=d.body,bs=0;
  d.body.querySelectorAll('article,main,div,section,td').forEach(e=>{let s=0;
    e.childNodes.forEach(n=>{if(n.nodeType===3)s+=n.textContent.trim().length;else if(n.tagName==='P'){const t=n.textContent.length;if(t>40&&linkLen(n)/t<.3)s+=t}});
    if(/^(ARTICLE|MAIN)$/.test(e.tagName))s*=1.3;if(s>bs){bs=s;best=e}});
  const out=[],seen=new Set();
  const push=t=>{t=t.replace(/https?:\/\/\S+|www\.\S+/gi,'').replace(/\s+/g,' ').trim();
    if(t.length<2||JUNK_TXT.test(t)||seen.has(t)||(/\b(Ảnh|Nguồn ảnh|Photo)\s*:\s*\S+/i.test(t)&&t.length<250))return;seen.add(t);out.push(t)};
  const blocks=best.querySelectorAll('h1,h2,h3,p');
  if(blocks.length>=3){blocks.forEach(p=>{const t=p.textContent;if(t.trim().length&&linkLen(p)/t.length>.5)return;
      t.split('\n').forEach(push)})}
  else{best.childNodes.forEach(n=>{if(n.nodeType===3)n.textContent.split('\n').forEach(push);else if(!/^(A|SCRIPT)$/.test(n.tagName)&&linkLen(n)/(n.textContent.length||1)<.5)n.textContent.split('\n').forEach(push)})}
  if(title&&out.length&&!seen.has(title.trim()))out.unshift(title.trim().replace(/\s+/g,' '));
  return out.join('\n\n')}
async function fetchPage(u){
  const tries=[x=>x,x=>'https://api.allorigins.win/raw?url='+encodeURIComponent(x),x=>'https://corsproxy.io/?'+encodeURIComponent(x),x=>'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(x)];
  for(const t of tries){try{const c=new AbortController(),to=setTimeout(()=>c.abort(),12000);const r=await fetch(t(u),{signal:c.signal});clearTimeout(to);
    if(r.ok){const h=await r.text();if(h.length>200)return h}}catch(e){}}
  throw new Error('fail')}
const isChap=s=>/^((chương|chapter|capítulo|hồi|phần|quyển|tập|บทที่|ບົດທີ)\s*[\divxlc]+|câu chuyện thứ\s+\d+|第[\d一二三四五六七八九十百]+[章回节節])/i.test(s)&&s.length<90;
function fixes(s){(($('fix').value||'').split('\n')).forEach(l=>{const i=l.indexOf('=');if(i>0){const a=l.slice(0,i).trim(),b=l.slice(i+1).trim();if(a)s=s.split(a).join(b)}});return s}
function hash(t){let h=0;for(let i=0;i<Math.min(t.length,4000);i++)h=(h*31+t.charCodeAt(i))|0;return'pos'+h+'_'+t.length}

const HEAD=/(CÂU CHUYỆN THỨ \d+:(?:[ \t]+[^\s\p{Ll}]+(?=\s|$))*)/gu;

g:"1. Mở tài liệu: chọn tệp (.txt .pdf .epub .mobi/.azw .fb2 .docx .md .cbz), dán link hoặc văn bản, hoặc chọn trong Thư viện.\n2. Bấm ▶ để nghe; chạm một câu để đọc từ đó. Chữ đang đọc sáng lên trong câu (tuỳ giọng).\n3. Bôi đen chữ: 🔊 đọc riêng đoạn đó · ● 5 màu tô sáng · 📝 ghi chú · 🌐 dịch.\n4. 🔍 tìm trong sách (gõ không dấu vẫn được) · 📒 Sổ tay gom mọi đoạn tô sáng · 🧹 bỏ dòng quảng cáo lặp.\n5. Giọng đọc lấy từ máy. Tự nhận diện ngôn ngữ sẽ chọn giọng cho từng ngôn ngữ; lời thoại trong ngoặc kép có thể dùng giọng hoặc cao độ khác.\n6. Sửa cách đọc: mỗi dòng từ=cách đọc. Có hẹn giờ tắt, thanh tốc độ và cao độ.\n7. Thư viện: nhập tên + link rồi Thêm; ⭐ đặt mặc định; ✕ xoá; tích “tự đọc cuốn kế” để nghe liên tục, có tiếng chuông.\n8. Âm nền: mưa, lửa trại, rừng, sóng, gió, ồn trắng/nâu, nhạc đọc sách, chill, cổ điển — chạy liên tục đến khi bạn bấm tắt.\n9. Hiển thị: 🌓 đổi sáng/sepia/tối, A−/A+, phông, giãn dòng, căn đều.\n10. Máy tính: Space, ←/→, Ctrl+↑/↓. Khoá màn hình có thể làm dừng đọc.\n11. Tải link, PDF, EPUB, Word, CBZ cần có mạng và chỉ chạy khi mở tệp đã tải về hoặc web riêng. Nội dung sách ở lại trên máy bạn.\n12. Mới: OCR cho PDF scan/ảnh (tự hỏi khi PDF không có chữ) · nút 拼 hiện pinyin cho chữ Hán · hình và bảng trong EPUB chạm để phóng to, chú thích gom cuối sách · ⬇️ xuất EPUB · 🖨️ in/PDF khổ A5 · 📄 xem trang gốc của PDF · 2 cột · tìm cả thư viện · lọc Sổ tay theo màu · giọng AI Piper (thử nghiệm, nặng).\n13. Điều khiển giọng kể: âm lượng, tốc độ và cao độ cho người dẫn và lời thoại, quãng nghỉ giữa câu/đoạn, nút Nghe thử; cài đặt được nhớ theo từng giọng.\n14. Thư viện mặc định lấy từ tệp Library.txt trên mạng (mỗi dòng: Tên: link). Sửa tệp đó để đổi sách mà không phải sửa code; bấm 🔄 để cập nhật. Mục 🌐 là của danh sách trực tuyến, mục bạn tự thêm có nút ✕."},

g:"1. Open a document: pick a file (.txt .pdf .epub .mobi/.azw .fb2 .docx .md .cbz), paste a link or text, or choose from the Library.\n2. Press ▶ to listen; tap a sentence to start there. The word being read lights up (depends on the voice).\n3. Select text: 🔊 read only that part · ● 5 highlight colors · 📝 note · 🌐 translate.\n4. 🔍 search the book (accents optional) · 📒 Notebook of all highlights · 🧹 remove repeated ad lines.\n5. Voices come from your device. Auto-detect language picks a voice per language; dialogue in quotes can use another voice or pitch.\n6. Fix pronunciation: one per line, word=reading. There is a sleep timer, speed and pitch.\n7. Library: enter a name + link, then Add; ⭐ sets the default; ✕ deletes; tick “auto-play next book” to listen non-stop, with a chime.\n8. Ambient: rain, campfire, forest, waves, wind, white/brown noise, reading, chill and classical music — plays until you turn it off.\n9. Display: 🌓 light/sepia/dark, A−/A+, font, line spacing, justify.\n10. Desktop: Space, ←/→, Ctrl+↑/↓. Locking the screen may stop reading.\n11. Loading links, PDF, EPUB, Word and CBZ needs internet and works from the downloaded file or your own website. Book content stays on your device.\n12. New: OCR for scanned PDFs/images (asked when a PDF has no text) · 拼 shows pinyin over Chinese · EPUB images and tables tap to enlarge, footnotes gathered at the end · ⬇️ export EPUB · 🖨️ print/PDF A5 · 📄 original PDF pages · 2 columns · search the whole library · filter Notebook by color · Piper AI voices (experimental, heavy).\n13. Narration controls: volume, speed and pitch for narrator and dialogue, pauses between sentences/paragraphs, a Test voice button; settings are remembered per voice.\n14. The default Library comes from an online Library.txt (one line each: Title: link). Edit that file to change books without touching the code; tap 🔄 to refresh. 🌐 items come from the online list; items you add have ✕."},

g:"1. เปิดเอกสาร: เลือกไฟล์ (.txt .pdf .epub .mobi/.azw .fb2 .docx .md .cbz) วางลิงก์หรือข้อความ หรือเลือกจากคลังหนังสือ\n2. กด ▶ เพื่อฟัง แตะประโยคเพื่ออ่านจากตรงนั้น คำที่กำลังอ่านจะสว่างขึ้น (ขึ้นกับเสียง)\n3. เลือกข้อความ: 🔊 อ่านเฉพาะส่วนนั้น · ● ไฮไลต์ 5 สี · 📝 บันทึก · 🌐 แปล\n4. 🔍 ค้นหาในหนังสือ (พิมพ์ไม่มีวรรณยุกต์ก็ได้) · 📒 สมุดโน้ตรวมไฮไลต์ทั้งหมด · 🧹 ลบบรรทัดโฆษณาที่ซ้ำ\n5. เสียงมาจากอุปกรณ์ การตรวจจับภาษาจะเลือกเสียงตามภาษา บทสนทนาในเครื่องหมายคำพูดใช้เสียงหรือระดับเสียงอื่นได้\n6. แก้การออกเสียง: บรรทัดละ คำ=คำอ่าน มีตั้งเวลาปิด ปรับความเร็วและระดับเสียง\n7. คลังหนังสือ: ใส่ชื่อ + ลิงก์ แล้วกดเพิ่ม ⭐ ตั้งค่าเริ่มต้น ✕ ลบ ติ๊ก “เล่นเล่มถัดไป” เพื่อฟังต่อเนื่อง มีเสียงระฆัง\n8. เสียงบรรยากาศ: ฝน กองไฟ ป่า คลื่น ลม ไวต์/บราวน์นอยส์ เพลงอ่านหนังสือ ชิลล์ คลาสสิก เล่นต่อเนื่องจนกว่าจะปิด\n9. การแสดงผล: 🌓 สว่าง/ซีเปีย/มืด, A−/A+, ฟอนต์, ระยะบรรทัด, ชิดขอบ\n10. คอมพิวเตอร์: Space, ←/→, Ctrl+↑/↓ การล็อกหน้าจออาจหยุดการอ่าน\n11. การโหลดลิงก์ PDF EPUB Word CBZ ต้องใช้อินเทอร์เน็ตและใช้ได้กับไฟล์ที่ดาวน์โหลดหรือเว็บของคุณ เนื้อหาหนังสืออยู่ในอุปกรณ์ของคุณ\n12. ใหม่: OCR สำหรับ PDF/รูปภาพสแกน · ปุ่ม 拼 แสดงพินอินบนอักษรจีน · รูปและตารางใน EPUB แตะเพื่อขยาย รวมเชิงอรรถไว้ท้ายเล่ม · ⬇️ ส่งออก EPUB · 🖨️ พิมพ์/PDF A5 · 📄 หน้าต้นฉบับของ PDF · 2 คอลัมน์ · ค้นหาทั้งคลัง · กรองสมุดโน้ตตามสี · เสียง AI Piper (ทดลอง, หนัก)\n13. ควบคุมเสียงเล่า: ความดัง ความเร็ว และระดับเสียงของผู้บรรยายและบทสนทนา ช่วงหยุดระหว่างประโยค/ย่อหน้า ปุ่มทดลองฟัง และจำค่าตามแต่ละเสียง\n14. คลังหนังสือเริ่มต้นดึงจากไฟล์ Library.txt ออนไลน์ (บรรทัดละเล่ม: ชื่อ: ลิงก์) แก้ไฟล์นั้นเพื่อเปลี่ยนหนังสือโดยไม่ต้องแก้โค้ด กด 🔄 เพื่ออัปเดต รายการ 🌐 มาจากรายการออนไลน์ ส่วนรายการที่คุณเพิ่มมีปุ่ม ✕"},

g:"1. ເປີດເອກະສານ: ເລືອກໄຟລ໌ (.txt .pdf .epub .mobi/.azw .fb2 .docx .md .cbz) ວາງລິ້ງ ຫຼືຂໍ້ຄວາມ ຫຼືເລືອກຈາກຫ້ອງສະໝຸດ\n2. ກົດ ▶ ເພື່ອຟັງ ແຕະປະໂຫຍກເພື່ອອ່ານຈາກບ່ອນນັ້ນ ຄຳທີ່ກຳລັງອ່ານຈະສະຫວ່າງຂຶ້ນ (ຂຶ້ນກັບສຽງ)\n3. ເລືອກຂໍ້ຄວາມ: 🔊 ອ່ານສະເພາະສ່ວນນັ້ນ · ● ໄຮໄລ້ 5 ສີ · 📝 ບັນທຶກ · 🌐 ແປ\n4. 🔍 ຄົ້ນຫາໃນປຶ້ມ (ພິມບໍ່ມີວັນນະຍຸດກໍໄດ້) · 📒 ສະໝຸດບັນທຶກລວມໄຮໄລ້ທັງໝົດ · 🧹 ລຶບແຖວໂຄສະນາທີ່ຊ້ຳ\n5. ສຽງມາຈາກອຸປະກອນ ການກວດພາສາຈະເລືອກສຽງຕາມພາສາ ບົດສົນທະນາໃນເຄື່ອງໝາຍຄຳເວົ້າໃຊ້ສຽງ ຫຼືລະດັບສຽງອື່ນໄດ້\n6. ແກ້ການອອກສຽງ: ແຕ່ລະແຖວ ຄຳ=ຄຳອ່ານ ມີຕັ້ງເວລາປິດ ປັບຄວາມໄວ ແລະລະດັບສຽງ\n7. ຫ້ອງສະໝຸດ: ໃສ່ຊື່ + ລິ້ງ ແລ້ວກົດເພີ່ມ ⭐ ຕັ້ງຄ່າເລີ່ມຕົ້ນ ✕ ລຶບ ຕິກ “ຫຼິ້ນເຫຼັ້ມຖັດໄປ” ເພື່ອຟັງຕໍ່ເນື່ອງ ມີສຽງລະຄັງ\n8. ສຽງບັນຍາກາດ: ຝົນ ກອງໄຟ ປ່າ ຄື້ນ ລົມ ສຽງຂາວ/ນ້ຳຕານ ເພງອ່ານປຶ້ມ ຊິວ ຄລາສສິກ ຫຼິ້ນຕໍ່ເນື່ອງຈົນກວ່າຈະປິດ\n9. ການສະແດງຜົນ: 🌓 ສະຫວ່າງ/ຊີເປຍ/ມືດ, A−/A+, ຟອນ, ໄລຍະແຖວ, ຈັດຊິດຂອບ\n10. ຄອມພິວເຕີ: Space, ←/→, Ctrl+↑/↓ ການລັອກໜ້າຈໍອາດຢຸດການອ່ານ\n11. ການໂຫຼດລິ້ງ PDF EPUB Word CBZ ຕ້ອງມີອິນເຕີເນັດ ແລະໃຊ້ໄດ້ກັບໄຟລ໌ທີ່ດາວໂຫຼດ ຫຼືເວັບຂອງທ່ານ ເນື້ອຫາປຶ້ມຢູ່ໃນອຸປະກອນຂອງທ່ານ\n12. ໃໝ່: OCR ສຳລັບ PDF/ຮູບສະແກນ · ປຸ່ມ 拼 ສະແດງພິນອິນເທິງຕົວອັກສອນຈີນ · ຮູບ ແລະຕາຕະລາງໃນ EPUB ແຕະເພື່ອຂະຫຍາຍ ລວມໝາຍເຫດໄວ້ທ້າຍເຫຼັ້ມ · ⬇️ ສົ່ງອອກ EPUB · 🖨️ ພິມ/PDF A5 · 📄 ໜ້າຕົ້ນສະບັບຂອງ PDF · 2 ຄໍລຳ · ຄົ້ນຫາທັງຫ້ອງສະໝຸດ · ກັ່ນຕອງສະໝຸດບັນທຶກຕາມສີ · ສຽງ AI Piper (ທົດລອງ, ໜັກ)\n13. ຄວບຄຸມສຽງເລົ່າ: ຄວາມດັງ ຄວາມໄວ ແລະລະດັບສຽງຂອງຜູ້ບັນຍາຍ ແລະບົດສົນທະນາ ຊ່ວງຢຸດລະຫວ່າງປະໂຫຍກ/ວັກ ປຸ່ມທົດລອງຟັງ ແລະຈື່ຄ່າຕາມແຕ່ລະສຽງ\n14. ຫ້ອງສະໝຸດເລີ່ມຕົ້ນດຶງຈາກໄຟລ໌ Library.txt ອອນລາຍ (ແຖວລະເຫຼັ້ມ: ຊື່: ລິ້ງ) ແກ້ໄຟລ໌ນັ້ນເພື່ອປ່ຽນປຶ້ມໂດຍບໍ່ຕ້ອງແກ້ໂຄດ ກົດ 🔄 ເພື່ອອັບເດດ ລາຍການ 🌐 ມາຈາກລາຍການອອນລາຍ ສ່ວນລາຍການທີ່ທ່ານເພີ່ມມີປຸ່ມ ✕"},

  ($('spell').value||'').split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0){const a=l.slice(0,i).trim(),b=l.slice(i+1).trim();if(a)x=x.replace(new RegExp('(?<![\\p{L}\\p{N}])'+a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![\\p{L}\\p{N}])','gu'),b)}});return x}
$('spell').value=store.get('spell','');$('spell').oninput=()=>store.set('spell',$('spell').value);$('norm').checked=store.get('norm',true);$('norm').onchange=()=>store.set('norm',$('norm').checked);
/* OCR cho PDF scan và ảnh chụp (Tesseract.js, chạy ngay trên máy) */
const OL={vi:'vie+eng',en:'eng',es:'spa+eng',th:'tha+eng',lo:'lao+eng',zh:'chi_sim+eng'};
const ocrFlow=x=>x.replace(/([^\n])\n(?!\n)/g,'$1 ');
async function ocrStart(){if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');return Tesseract.createWorker(OL[lang]||'eng')}
async function pdfOcr(f){if(MOB&&!confirm(t('heavy')))throw new Error('x');await loadPdfLib();const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,w=await ocrStart(),out=[];S.pdfDoc=pdf;
  for(let p=1;p<=pdf.numPages;p++){$('urlSt').textContent='OCR '+p+'/'+pdf.numPages;const pg=await pdf.getPage(p),vp=pg.getViewport({scale:2}),cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;
    await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;out.push(ocrFlow((await w.recognize(cv)).data.text))}
  await w.terminate();return out.join('\n\n')}

/* thư viện: lưu nội dung các cuốn đã mở để tìm trong cả thư viện */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('lazi',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});

async function libSearch(q,out){const all=await idbAll();let n=0;
  for(const k in all){const b=all[k],tx=b.text.normalize('NFC'),nt=nz(tx);let pos=0,c=0;

  z.file('OEBPS/content.opf','<?xml version="1.0" encoding="utf-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="id"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="id">'+S.key+'</dc:identifier><dc:title>'+E(title)+'</dc:title><dc:language>'+(S.dom||lang)+'</dc:language><meta property="dcterms:modified">'+new Date().toISOString().slice(0,19)+'Z</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="css" href="style.css" media-type="text/css"/>'+chs.map((c,i)=>'<item id="c'+i+'" href="c'+i+'.xhtml" media-type="application/xhtml+xml"/>').join('')+'</manifest><spine>'+chs.map((c,i)=>'<itemref idref="c'+i+'"/>').join('')+'</spine></package>');
  const b=await z.generateAsync({type:'blob',mimeType:'application/epub+zip'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=title.replace(/[^\p{L}\p{N}]+/gu,'_')+'.epub';a.click()};

/* giọng AI chạy trên máy (Piper qua vits-web) — thử nghiệm */
const PQ=new Map();let tts=null;
async function piperWav(pid,txt){const k=pid+'|'+txt;
  if(!PQ.has(k)){PQ.set(k,(async()=>{if(!tts){$('urlSt').textContent=t('sl');tts=await import('https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/+esm')}

function piperSay(pid,txt,dlg,my){const nx=S.sents[S.idx+1];if(nx)piperWav(pid,fixes(nx)).catch(()=>{});
  piperWav(pid,txt).then(url=>{if(my!==S.tok||!S.on)return;const a=new Audio(url);S.audio=a;const cf=vcfg(dlg,true);a.volume=Math.min(1,cf.vol);a.preservesPitch=!dlg;a.playbackRate=Math.min(3,Math.max(.5,cf.rate*(dlg?+$('dpitch').value:1)));
    a.onended=()=>{if(my!==S.tok||!S.on)return;const dl=dly(S.idx);S.idx++;setTimeout(say,dl)};a.onerror=()=>{if(my!==S.tok)return;S.idx++;say()};a.play().catch(()=>{})}).catch(()=>{$('urlSt').textContent=t('pfail');stop()})}
/* ---------- Điều khiển giọng kể: âm lượng, tốc độ, quãng nghỉ, nghe thử, hồ sơ theo giọng ---------- */
const VI=['rate','pitch','nvol','drate','dvol','dpitch','gap','pgap'],VD={rate:1,pitch:1,nvol:1,drate:.95,dvol:1,dpitch:1.2,gap:140,pgap:250};
function vcfg(dlg,same){const r=+$('rate').value,p=+$('pitch').value;return{rate:dlg?r*(+$('drate').value):r,pitch:Math.min(2,dlg&&same?p*(+$('dpitch').value):p),vol:Math.max(0,Math.min(1,dlg?+$('dvol').value:+$('nvol').value))}}
function dly(i){const r=S.sents[i]||'';return(r.length<4?0:+$('gap').value)+(S.pend&&S.pend.has(i)?+$('pgap').value:0)}

  $('v_nvol').textContent=Math.round($('nvol').value*100)+'%';$('v_dvol').textContent=Math.round($('dvol').value*100)+'%';$('v_drate').textContent=(+$('drate').value).toFixed(2)+'×';

function pick(lg,dlg){const vn=$('voice').value,v2=$('voice2').value,base=voices.find(x=>x.name===vn),nv=voiceFor(lg,base)||base;let alt=null;
  if(dlg){const o2=voices.find(x=>x.name===v2);if(v2==='__auto'||(o2&&nv&&o2.lang.slice(0,2)!==nv.lang.slice(0,2)))alt=altVoice(nv);else if(o2&&o2!==nv)alt=o2}return{v:alt||nv,same:dlg&&!alt}}

    if(pvn.startsWith('piper:')){piperWav(pvn.slice(6),txt).then(url=>{if(tok!==S.tok)return;const a=new Audio(url);S.audio=a;a.volume=c.vol;a.preservesPitch=!dlg;a.playbackRate=Math.min(3,Math.max(.5,c.rate*(dlg?+$('dpitch').value:1)));a.onended=cb;a.play().catch(()=>{})}).catch(()=>{});return}
